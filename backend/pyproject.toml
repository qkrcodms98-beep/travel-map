[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.162.0",
    "python-dotenv==1.2.4",
    "tzdata==2026.6",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
# tests/에서 app 패키지를 불러올 수 있게 backend/를 기준 폴더로 둔다
pythonpath = ["."]
testpaths = ["tests"]
